name: kernel

# Weekly bump of the pinned inputs of the Raspberry Pi kernel
# (nixpkgs-kernel and nixos-hardware-kernel in flake.lock), committed to main.
# Nothing is compiled or published here: the "ci" workflow builds the new
# kernel if it changed and pushes it to the Cachix cache, then moves prod.
#
# Scheduled runs only exist on the default branch; use "Run workflow" to run
# it by hand.

on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write # the flake.lock commit
  actions: write # starts the ci workflow (see the last step)

concurrency:
  group: kernel
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.5

      - name: Bump the kernel inputs
        run: nix flake update nixpkgs-kernel nixos-hardware-kernel

      - name: Commit the new flake.lock
        id: commit
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: bump the kernel inputs"
          git pull --rebase origin main
          git push origin HEAD:main || {
            echo "::error::flake.lock could not be pushed (protected branch?). Push the nixpkgs-kernel and nixos-hardware-kernel bump by hand."
            exit 1
          }
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow token does not trigger other workflows:
      # start ci explicitly.
      - name: Start the ci workflow
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run ci.yml --ref main
