name: kernel

# Builds the Raspberry Pi 4 kernel of hosts/ (cross-compiled from
# x86_64, about 3 h on a 2-core runner) and publishes it as a GitHub release
# (tag kernel-<store hash of the kernel>, one kernel.nar.zst asset). The image
# workflow (image.yml) imports it and never compiles the kernel.
#
# The kernel only depends on the flake inputs nixpkgs-kernel and
# nixos-hardware-kernel (flake.lock). This workflow bumps them weekly, builds
# the new kernel if it changed, then commits the new flake.lock. Changing the
# rest of the configuration, or the other inputs, does not touch the kernel.
#
# Scheduled runs only exist on the default branch; use "Run workflow" to run
# it from another branch.

on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      update:
        description: "Bump nixpkgs-kernel and nixos-hardware-kernel first (false: build the currently locked kernel)"
        type: boolean
        default: true

permissions:
  contents: write # releases, and the flake.lock commit

concurrency:
  group: kernel
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Bump the kernel inputs
        if: github.event_name == 'schedule' || inputs.update
        run: nix flake update nixpkgs-kernel nixos-hardware-kernel

      - name: Resolve the kernel
        id: kernel
        run: |
          attr=.#nixosConfigurations.chambre-de-leo.config.boot.kernelPackages.kernel
          out=$(nix eval --raw "$attr.outPath")
          hash=$(basename "$out" | cut -d- -f1)
          echo "drv=$(nix eval --raw "$attr.drvPath")" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "tag=kernel-$hash" >> "$GITHUB_OUTPUT"
          echo "Kernel: $out"

      - name: Already published?
        id: exists
        run: |
          if gh release view "${{ steps.kernel.outputs.tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.kernel.outputs.tag }} exists: nothing to build."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build kernel
        if: steps.exists.outputs.published != 'true'
        run: |
          nix build -L --cores 0 --no-link --print-out-paths "${{ steps.kernel.outputs.drv }}^*" > "$RUNNER_TEMP/outs"

      - name: Publish kernel
        if: steps.exists.outputs.published != 'true'
        run: |
          # All outputs (out, dev, modules) and their runtime closure.
          outs=$(cat "$RUNNER_TEMP/outs")
          [ -n "$outs" ] || { echo "::error::no kernel output found"; exit 1; }
          nix-store --export $(nix-store --query --requisites $outs) | zstd -T0 -19 -o kernel.nar.zst
          ls -lh kernel.nar.zst
          gh release create "${{ steps.kernel.outputs.tag }}" kernel.nar.zst \
            --target "$GITHUB_SHA" \
            --title "Soloist Pi kernel ${{ steps.kernel.outputs.tag }}" \
            --notes "Kernel $(basename "${{ steps.kernel.outputs.out }}"), built by run ${{ github.run_id }}. Imported by the image workflow."

      - name: Commit the new flake.lock
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: bump the kernel inputs (${{ steps.kernel.outputs.tag }})"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME" || {
            echo "::error::Kernel published (${{ steps.kernel.outputs.tag }}) but flake.lock could not be pushed (protected branch?). Push the nixpkgs-kernel and nixos-hardware-kernel bump by hand."
            exit 1
          }

      - name: Delete old kernel releases (keep the 3 newest)
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("kernel-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
