name: image

# Builds the SD card images of hosts/ (one per device, see
# hosts/devices/), on demand only: by hand (Run workflow) or on a version tag
# (v*). The kernel is NOT built here: the "ci" workflow pushes it to the
# Cachix cache, and this workflow fails at once if it is not there. The rest
# comes from cache.nixos.org and Cachix. The image is published as a workflow
# artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: ubuntu-latest (x86_64, aarch64 emulation) or ubuntu-24.04-arm (native, billed per minute on a private repo)"
        type: choice
        options: [ubuntu-latest, ubuntu-24.04-arm]
        default: ubuntu-latest

permissions:
  contents: read

env:
  CACHE_URL: https://kernelb00t.cachix.org

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        device: [chambre-de-leo, chambre-de-sarah, television]
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up aarch64 emulation
        if: runner.arch == 'X64'
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.5
        with:
          extra_nix_config: |
            extra-platforms = aarch64-linux

      # Read-only use of the cache (no token): kernel and AirPlay 2 build.
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: kernelb00t
          skipPush: true

      - name: Check that the kernel is in the cache
        run: |
          out=$(nix eval --raw .#nixosConfigurations.${{ matrix.device }}.config.boot.kernelPackages.kernel.outPath)
          if ! nix path-info --store "$CACHE_URL" "$out" >/dev/null 2>&1; then
            echo "::error::Kernel $out is not in the Cachix cache. Run the 'ci' workflow on main (it builds and pushes the kernel), then re-run this one. Do not wait for a compilation here."
            exit 1
          fi

      - name: Build image
        run: nix build -L --cores 0 --max-jobs auto .#${{ matrix.device }}-image

      - name: Upload image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.device }}-sd-image
          path: result/sd-image/*.img.zst
          compression-level: 0
          retention-days: 7
